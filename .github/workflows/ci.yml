name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make check-py
      - name: Build fixture outputs
        run: uv run --locked scrubcast build --fixtures
      - name: Validate published outputs
        run: uv run --locked pytest tests/integration/test_published_outputs.py
      - name: Scan full history for secrets
        run: |
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci
      - run: npm --prefix site run check
      - run: npm --prefix site test
      - name: Install browsers
        working-directory: site
        run: npx playwright install --with-deps chromium webkit
      - run: npm --prefix site run e2e
      - run: npm --prefix site run build
      - run: npm --prefix site run cards
      - run: npm --prefix site run budget
      - run: make cold-start
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress README.md CONTRIBUTING.md SECURITY.md docs
          fail: true
