name: mutation

on:
  schedule:
    - cron: "47 3 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked mutmut run
      - run: uv run --locked mutmut export-cicd-stats
      - run: uv run --locked python scripts/mutation-score.py
